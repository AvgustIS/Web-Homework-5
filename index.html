<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Project</title>
    <link rel="stylesheet" href="./styles/output.css">
    <script src="main.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-md bg-white shadow-xl rounded-2xl p-8 border border-slate-100 space-y-6">
        
        <form class="space-y-4">
            <div>
                <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Name</label>
                <input id="name" type="text" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
            </div>
            <div>
                <label for="birth" class="block text-sm font-medium text-slate-700 mb-1">Your Birth Year</label>
                <input id="birth" type="text" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
            </div>
            <button id="submit" type="button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition shadow-sm">
                Create
            </button>
        </form>

        <hr class="border-slate-200">

        <div class="space-y-4">
            <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Hobby List</h3>
            <ul id="listHobby" class="space-y-2">
                <li id="liHobby1" class="bg-slate-50 px-4 py-2 rounded-lg border border-slate-200 text-slate-700">chess</li>
                <li id="liHobby2" class="bg-slate-50 px-4 py-2 rounded-lg border border-slate-200 text-slate-700">coding</li>
                <li id="liHobby3" class="bg-slate-50 px-4 py-2 rounded-lg border border-slate-200 text-slate-700">Football</li>
            </ul>

            <button id="remove" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-600 font-medium py-2 rounded-lg transition border border-rose-200">
                Remove Last
            </button>

            <div class="flex gap-2 pt-2">
                <input id="inputItem" type="text" placeholder="New hobby..." class="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                <button id="addItembtn" type="button" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 font-medium rounded-lg transition shadow-sm">
                    Add
                </button>
            </div>
        </div>

    </div>

</body>
</html>
